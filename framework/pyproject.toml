[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlab"
version = "0.1.0"
description = "Cross-sectional equity factor construction and matrix-based backtesting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
]

[project.optional-dependencies]
plot = ["plotly"]
dev = ["pytest", "pyarrow"]

[tool.setuptools]
packages = ["factorlab"]

